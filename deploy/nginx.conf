# Dùng nếu VPS đã có sẵn Nginx. Chép vào /etc/nginx/sites-available/think-chat,
# sửa server_name, bật site, rồi chạy: sudo certbot --nginx -d chat.tenmien.com
server {
    listen 80;
    server_name chat.tenmien.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # cần cho realtime (WebSocket)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
